; Phase1(숲) 레벨 수치 파일 — 이 파일의 값이 게임에 그대로 적용된다.
; 단위: 시간 = 초, 거리 = px.  [.] = 레벨 자신.  모든 값은 프로토타입용 임시값이다.
; 테스트 중에는 치트 4(` + 4)로 보병 1 → 2 → 4 → 6 → 0명, 치트 5(` + 5)로 암살자 0 → 1 → 2 → 3명,
; 치트 6(` + 6)으로 석궁병, 치트 7(` + 7)로 거병 0 → 1 → 2 → 3명을 바로 바꿀 수 있다
; (이 파일 값은 시작 인원).

[.]
; 한 번에 나오는 제3부대 보병 수 (0~6)
squad_size=2
; 한 번에 나오는 제3부대 암살자 수 (0~3) — 멀리서 나타나 순보로 다가온다
assassin_count=1
assassin_spawn_distance=700.0
; 한 번에 나오는 제3부대 석궁병 수 (0~3) — 이만큼 떨어진 자리에 서서 지킨다
crossbow_count=1
crossbow_spawn_distance=520.0
; 한 번에 나오는 제3부대 거병 수 (0~3)
giant_count=1
giant_spawn_distance=600.0
; 분대를 모두 쓰러뜨린 뒤 다음 분대가 올 때까지
wave_delay=3.0
; 플레이어에게서 이만큼은 떨어져 나타난다 / 같은 쪽 보병끼리 등장 간격
min_spawn_distance=360.0
spawn_row_gap=90.0
