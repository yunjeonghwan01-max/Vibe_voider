; 수치 파일 — 이 파일의 값이 게임에 그대로 적용된다 (코드나 씬에 같은 값이 있어도 이 파일이 이긴다).
; 단위: 시간 = 초, 거리 = px, 속도 = px/s.  기준: 플레이어 평타 1타 = 10
; [섹션]은 씬 안의 노드 위치("." = 객체 자신), 왼쪽은 속성 이름. 이름은 바꾸지 말고 숫자만 바꾼다.

[Combat/Health]
; 최대 체력
max_hp=100

[Combat/Hurtbox]
; 피격 후 무적 시간 (이 동안 캐릭터가 깜빡이고 어떤 공격도 안 들어간다)
invincibility_duration=0.8

[.]
; ── 이동 ──
run_speed=330.0
jump_velocity=-560.0
double_jump_velocity=-520.0
; 공중 점프 횟수
air_jumps=1
gravity=1500.0
; 하강할 때 중력 배율
fall_gravity_mult=1.55
dash_speed=760.0
dash_time=0.15
dash_cooldown=0.3
; 공중 대시 횟수
air_dashes=1

; ── 평타 3연타 (1타, 2타, 3타) ──
combo_damage=[10, 12, 20]
combo_knockback=[160.0, 160.0, 320.0]
swing_windup=0.035
swing_active=0.11
swing_recovery=0.1
; 마지막 입력 후 이 시간이 지나면 콤보 초기화
combo_reset_time=0.32

; ── 반격 ──
; 반격 결정타 (999 = 즉사, 보스는 따로 정한다)
counter_damage=999
; 헛반격 경직 / 헛반격 후 재입력 금지
parry_whiff_time=0.3
parry_whiff_cooldown=0.5
; 반격 성공 후 연쇄 반격 입력을 받는 시간
chain_window=0.2
; 연쇄 반격 몇 번마다 패기 방출
haki_every=3
haki_damage=15

; ── 궁극기 게이지 ──
ultimate_max=100.0
ult_charge_on_parry=34.0
ult_charge_on_hit=5.0
ult_charge_on_damaged=8.0
ult_charge_on_skill_hit=3.0
haki_ult_gain=50.0

; ── 궁극기: 반달 참격 ──
; 날아가며 닿은 적 피해 / 끝에서 터지는 폭발 피해 / 날아가는 거리
ult_body_damage=20
ult_burst_damage=40
ult_max_distance=1500.0

; ── 승천 참격 (아래 + E) ──
; 자세를 낮추고 모으는 시간 (이동 불가)
rising_windup=0.5
; 베고 나서 위로 튀어 오르는 속도 (-1000 ≈ 330px 높이)
rising_launch_velocity=-1000.0
; 튀어 오르다 적 몸에 부딪히면 이 속도로 떨어진다
rising_bump_fall_speed=320.0

; ── 대시 참격 ──
; 대시가 끝난 뒤에도 이 시간 안에 누르면 대시 참격
dash_slash_grace=0.12

[Combat/VoidOrb]
; 장풍 (공허 구체) — 한 적에게 최대 max_hits_per_target번, damage_per_hit씩 (7 × 3 = 21)
cooldown=4.0
damage_per_hit=7
max_hits_per_target=3
knockback_per_hit=60.0
speed=1725.0
max_distance=950.0

[Combat/DashSlash]
; 대시 참격
cooldown=3.0
damage=15
knockback=240.0

[Combat/Lightning]
; 번개
cooldown=2.0
damage=20

[Combat/RisingSlash]
; 승천 참격 (아래 + E)
cooldown=3.0
damage=20
knockback=260.0
; 베는 원의 반지름
radius=120.0
