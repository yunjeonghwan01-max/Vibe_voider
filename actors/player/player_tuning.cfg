; 수치 파일 — 이 파일의 값이 게임에 그대로 적용된다 (코드나 씬에 같은 값이 있어도 이 파일이 이긴다).
; 단위: 시간 = 초, 거리 = px, 속도 = px/s.  기준: 플레이어 평타 1타 = 10
; [섹션]은 씬 안의 노드 위치("." = 객체 자신), 왼쪽은 속성 이름. 이름은 바꾸지 말고 숫자만 바꾼다.

[Combat/Health]
; 최대 체력
max_hp=100

[Combat/Hurtbox]
; 피격 후 무적 시간 (이 동안 캐릭터가 깜빡이고 어떤 공격도 안 들어간다)
invincibility_duration=0.8

[.]
; ── 스킬 슬롯 (따옴표 안의 스킬 이름만 바꾼다) ──
; E를 누를 때 방향: 아래 > 위 > 기본.  "none" = 비움
; 방향 슬롯에 넣을 수 있는 스킬: "void_orb"(장풍) "spin_rise"(회전 상승) "dive"(강하) "lightning"(벼락) "rising_slash"(승천 참격)
slot_neutral="void_orb"
slot_up="spin_rise"
slot_down="dive"
; 대쉬 중 E (방향키보다 우선): "dash_slash"(대쉬 참격)
slot_dash="dash_slash"
; 궁극기 키: "sword_wave"(검격 날리기) "moon_slash"(월아 참격)
slot_ultimate="sword_wave"

; ── 이동 ──
run_speed=330.0
jump_velocity=-560.0
double_jump_velocity=-520.0
; 공중 점프 횟수
air_jumps=1
gravity=1500.0
; 하강할 때 중력 배율
fall_gravity_mult=1.55
dash_speed=760.0
dash_time=0.15
dash_cooldown=0.3
; 대시 중은 무적, 끝난 뒤에도 이 시간만큼 몰래 무적 (깜빡임 없음)
dash_after_iframe=0.15
; 공중 대시 횟수
air_dashes=1

; ── 평타 3연타 (1타, 2타, 3타) ──
combo_damage=[10, 12, 20]
combo_knockback=[160.0, 160.0, 320.0]
swing_windup=0.035
swing_active=0.11
swing_recovery=0.1
; 마지막 입력 후 이 시간이 지나면 콤보 초기화
combo_reset_time=0.32

; ── 반격 ──
; 반격 결정타 (999 = 즉사, 보스는 따로 정한다)
counter_damage=999
; 헛반격 경직 / 헛반격 후 재입력 금지
parry_whiff_time=0.3
parry_whiff_cooldown=0.5
; 반격 성공 후 연쇄 반격 입력을 받는 시간
chain_window=0.2
; 연쇄 반격 몇 번마다 패기 방출
haki_every=3
haki_damage=15

; ── 궁극기 게이지 ──
ultimate_max=100.0
ult_charge_on_parry=34.0
ult_charge_on_hit=5.0
ult_charge_on_damaged=8.0
ult_charge_on_skill_hit=3.0
haki_ult_gain=50.0

; ── 궁극기: 월아 참격 (slot_ultimate="moon_slash"일 때) ──
; 날아가며 닿은 적 피해 / 끝에서 터지는 폭발 피해 / 날아가는 거리
ult_body_damage=30
ult_burst_damage=60
ult_max_distance=1500.0

; ── 궁극기: 검격 날리기 ──
; 힘을 모으는 시전 시간 (무적) / 날린 뒤 자세가 풀리기까지
sword_wave_windup=0.6
sword_wave_recovery=0.36
; 첫 적·벽에 닿으면 원형 폭발: 피해 (임시 5N) / 반지름 / 넉백 (미정, 0 = 없음)
sword_wave_explosion_damage=50
sword_wave_explosion_radius=220.0
sword_wave_explosion_knockback=0.0
; 폭발 범위의 적마다 표식 — 이 시간 뒤 터져 주변 적에게 피해 (임시 1N, 넉백·경직 없음) / 표식 폭발 반지름
sword_wave_mark_delay=2.0
sword_wave_mark_damage=10
sword_wave_mark_radius=140.0

; ── 승천 참격 (슬롯에 넣었을 때) ──
; 자세를 낮추고 모으는 시간 (이동 불가)
rising_windup=0.5
; 베고 나서 위로 튀어 오르는 속도 (-1000 ≈ 330px 높이)
rising_launch_velocity=-1000.0
; 튀어 오르다 적 몸에 부딪히면 이 속도로 떨어진다
rising_bump_fall_speed=320.0

; ── 회전 상승 ──
; 웅크리는 예비 동작 / 상승 속도 / 올라가는 높이 (플레이어 키 = 54)
spin_windup=0.1
spin_rise_speed=1050.0
spin_rise_height=300.0
; 좌우 입력의 가속도 / 최대 좌우 속도 / 시작 지점에서 좌우로 벗어날 수 있는 거리 (몸 폭 = 30)
spin_side_accel=1400.0
spin_side_max_speed=260.0
spin_side_range=90.0
; 예비 동작·상승 중 무적 (true/false, 실험값)
spin_invincible=true

; ── 강하 ──
; 살짝 떠오르는 속도·시간 / 공중에 멈춰 자세를 잡는 시간 / 급강하 속도
dive_hop_speed=420.0
dive_hop_time=0.1
dive_hang_time=0.12
dive_speed=1700.0
; 급강하 시작 순간 좌우를 누르고 있으면 수직에서 이만큼 기운다 (도)
dive_angle=20.0
; 떠오름·체공·급강하 중 반격으로 끊을 수 있는가 (true/false, 실험값)
dive_counter_cancel=true

; ── 대시 참격 ──
; 대시가 끝난 뒤에도 이 시간 안에 누르면 대시 참격
dash_slash_grace=0.12

[Combat/VoidOrb]
; 장풍 (공허 구체) — 한 적에게 최대 max_hits_per_target번, damage_per_hit씩 (임시: 히트당 2.5N = 25)
cooldown=4.0
damage_per_hit=25
max_hits_per_target=3
; 적마다 첫 타의 큰 넉백 / 이후 타의 작은 넉백
first_knockback=420.0
knockback_per_hit=60.0
speed=1725.0
; 카메라 화면 끝에 닿으면 사라진다. 이 거리는 안전장치 (화면보다 넉넉히)
max_distance=4000.0

[Combat/DashSlash]
; 대시 참격
cooldown=3.0
damage=15
knockback=240.0

[Combat/Lightning]
; 번개
cooldown=2.0
damage=20

[Combat/RisingSlash]
; 승천 참격 (슬롯에 넣었을 때)
cooldown=3.0
damage=20
knockback=260.0
; 베는 원의 반지름
radius=120.0

[Combat/SpinRise]
; 회전 상승 — 재사용 대기 / 전부 맞으면 총 피해 (임시 2.5N = 25) / 피해를 나누는 틱 수
cooldown=1.0
total_damage=25
tick_count=10

[Combat/Dive]
; 강하 — 재사용 대기
cooldown=1.5
; 급강하 중 몸에 닿은 적 피해 (미정 — 임시 10, 아래 합계와 별도)
body_damage=10
; 작렬 + 지연 불꽃 합계: 제자리 강하 / bonus_height 이상 떨어졌을 때 (임시 3.5N ~ 5.5N)
min_total=35
max_total=55
bonus_height=450.0
; 합계 중 작렬 몫 (나머지는 불꽃) — 0.7 = 7:3
impact_ratio=0.7
impact_knockback=340.0
; 착지 뒤 불꽃이 솟기까지 (그동안 플레이어 행동 불가)
flame_delay=0.35
; 착지 지점 양옆 판정 거리
blast_half_width=150.0
