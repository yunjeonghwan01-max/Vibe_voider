; 제3부대 거병 수치 파일 — 이 파일의 값이 게임에 그대로 적용된다 (코드나 씬에 같은 값이 있어도 이 파일이 이긴다).
; 단위: 시간 = 초, 거리 = px, 속도 = px/s.  기준: 플레이어 평타 1타 = 10 (N)
; [섹션]은 씬 안의 노드 위치("." = 객체 자신), 왼쪽은 속성 이름. 이름은 바꾸지 말고 숫자만 바꾼다.
; 모든 값은 Phase1 프로토타입용 임시값이다 (확정 아님).

[Combat/Health]
; 체력 (보병 40의 3.5배 — 묵직하게)
max_hp=140

[.]
; ── 이동 ──
; 느린 걸음 / 반대편으로 돌아서기까지 / 플레이어 앞에서 멈추는 거리
move_speed=60.0
turn_delay=0.35
stop_distance=100.0
; 돌진(이동만, 피해 없음): 가로 거리가 이 사이일 때, 같은 바닥으로 막힘없이 이어져 있을 때만
charge_min=260.0
charge_max=700.0
charge_cooldown=4.0
; 돌진 전 웅크리는 예고 / 돌진 속도
charge_prep=0.35
charge_speed=430.0
; 높이 차이가 이보다 크면 다른 층 — 돌진하지 않는다
same_floor_height=30.0
contact_damage=0

; ── 1차 내려찍기 (MCI) ──
attack_range=130.0
attack_height=100.0
attack_cooldown=2.0
crowd_attack_gap=0.35
; 도끼를 천천히 치켜드는 예고 (이때 반격하면 헛반격)
raise_time=0.8
; 1차 FLASH — 이때만 반격 성공
glint_duration=0.45
strike_time=0.16
strike_step=120.0
; 반격 못 했을 때의 후딜
recover_time=1.0
; 1차 피해 (2.2N) / 넉백
damage1=22
knockback1=320.0

; ── ★ 2차 반동 내려찍기 (1차를 반격당했을 때만) ──
; 1차 반격 → 비틀(기절 아님) → 반동으로 다시 치켜듦(반격 불가) → 2차 FLASH → 2차 내려찍기
; 비틀 + 다시 치켜듦 = 0.85초 → 연쇄 반격 예약(0.2초)으로는 자동 성공하지 않는다. 새 반짝임을 보고 따로 누른다.
stumble_time=0.45
reraise_time=0.4
flash2_time=0.4
strike2_time=0.18
strike2_step=220.0
; 2차를 못 받아쳤을 때의 후딜
recover2_time=1.2
; 2차 피해 (3.2N) / 넉백 — 1차보다 아프다
damage2=32
knockback2=480.0
; 2차 판정 크기 배율 (가로, 세로) — 1차보다 넓다
hitbox2_scale=Vector2(1.35, 1.15)
; 2차까지 받아치면 쓰러지는 시간 (일반 기절 parry_stagger_time보다 길다)
heavy_stagger_time=2.6

; ── 반응 ──
; 맞았을 때 짧은 경직 (공격 동작 중엔 슈퍼아머라 끊기지 않는다) / 다른 적 반격에 휘말린 일반 기절
hitstun_time=0.12
parry_stagger_time=1.3
knockback_resist=0.6
spawn_time=0.8
