; 제3부대 암살자 수치 파일 — 이 파일의 값이 게임에 그대로 적용된다 (코드나 씬에 같은 값이 있어도 이 파일이 이긴다).
; 단위: 시간 = 초, 거리 = px, 속도 = px/s.  기준: 플레이어 평타 1타 = 10 (N)
; [섹션]은 씬 안의 노드 위치("." = 객체 자신), 왼쪽은 속성 이름. 이름은 바꾸지 말고 숫자만 바꾼다.
; 모든 값은 Phase1 프로토타입용 임시값이다 (확정 아님).

[Combat/Health]
; 체력 (보병 40보다 약하다)
max_hp=30

[.]
; ── 순보 (수평 고속 이동, 순보 중에도 언제나 맞는다) ──
; 이 거리 안에 들어오면 추격 시작
engage_range=1000.0
; 순보 속도 / 한 번에 가는 최대 거리 / 연속 순보 사이 멈춤
shunpo_speed=1500.0
shunpo_distance=260.0
shunpo_interval=0.22
; 멀 때 순보는 플레이어에게서 이 거리까지만 다가온다 (아래 blink_range보다 작게)
approach_stop=200.0
; ★ 뒤잡기: 플레이어와 가로 거리가 이 안이면, 순간이동처럼 보일 만큼 빠른 순보로 플레이어 등 뒤를 잡는다
blink_range=280.0
blink_speed=7000.0
; 플레이어 등 뒤 이 거리에 도착 / 이만큼 가까우면 도착으로 친다
arrive_offset=72.0
arrive_tolerance=28.0
; 플레이어와의 높이 차이가 이보다 크면 순보·공격하지 않고 기다린다
attack_height=90.0
; 몸에 닿아도 피해 없음 (순보로 몸을 지나쳐도 아프지 않다)
contact_damage=0

; ── 찌르기 (근접 카유공 MCI) ──
; 도착 후 자세 잡기 / 단검을 치켜드는 예고 (이때 반격 키를 누르면 헛반격)
settle_time=0.15
raise_time=0.5
; 금빛 반짝임(FLASH) — 이때만 반격 성공. 넉넉하게
glint_duration=0.45
; 찌르기 판정 시간 / 앞으로 내딛는 속도
strike_time=0.12
strike_lunge=300.0
; 찌른 뒤 빈틈 / 다음 추격까지 대기 (±20%)
recover_time=0.7
attack_cooldown=1.0
; 다른 보병·암살자가 공격을 치켜든 지 이 시간이 안 됐으면 기다린다
crowd_attack_gap=0.35
; 피해 (1.2N) / 넉백
attack_damage=12
attack_knockback=220.0

; ── 반응 ──
; 맞았을 때 짧은 경직 / 반격당했을 때 기절 시간
hitstun_time=0.16
parry_stagger_time=1.3
knockback_resist=0.0
spawn_time=0.6
