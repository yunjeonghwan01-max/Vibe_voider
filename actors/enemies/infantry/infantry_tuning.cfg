; 제3부대 보병 수치 파일 — 이 파일의 값이 게임에 그대로 적용된다 (코드나 씬에 같은 값이 있어도 이 파일이 이긴다).
; 단위: 시간 = 초, 거리 = px, 속도 = px/s.  기준: 플레이어 평타 1타 = 10 (N)
; [섹션]은 씬 안의 노드 위치("." = 객체 자신), 왼쪽은 속성 이름. 이름은 바꾸지 말고 숫자만 바꾼다.
; 모든 값은 Phase1 프로토타입용 임시값이다 (확정 아님).

[Combat/Health]
; 체력 (평타 3연타 = 42 → 한 콤보에 쓰러진다. 질보다 양)
max_hp=40

[.]
; ── 이동 ──
; 뚜벅뚜벅 걷는 속도 (플레이어 달리기 330)
move_speed=90.0
; 플레이어가 등 뒤로 넘어가면 이만큼 늦게 돌아선다
turn_delay=0.22
; 플레이어 앞 이 거리에서 멈춰 선다 / 같은 쪽 앞 동료와 떨어지는 간격
stop_distance=58.0
ally_spacing=36.0
; 몸에 닿아도 피해 없음 (공격은 내려베기 하나뿐)
contact_damage=0

; ── 내려베기 (근접 카유공 MCI) ──
; 이 가로 거리 / 세로 차이 안이면 공격을 시작한다
attack_range=100.0
attack_height=90.0
; 검을 치켜드는 예고 — 이때 반격 키를 누르면 헛반격
raise_time=0.55
; 금빛 반짝임(FLASH) — 이때만 반격 성공. 보병은 넉넉하게
glint_duration=0.45
; 내려베기 판정 시간 / 앞으로 내딛는 속도
strike_time=0.13
strike_step=140.0
; 내려벤 뒤 빈틈
recover_time=0.8
; 다음 공격까지 대기 (개체마다 ±25%)
attack_cooldown=1.6
; 다른 보병이 검을 치켜든 지 이 시간이 안 됐으면 기다린다 (반짝임이 완전히 겹치지 않게)
crowd_attack_gap=0.35
; 피해 (1.5N) / 넉백
attack_damage=15
attack_knockback=260.0

; ── 반응 ──
; 맞았을 때 짧은 경직 / 반격당했을 때 기절 시간
hitstun_time=0.16
parry_stagger_time=1.3
; 넉백 저항 (0 = 그대로 밀림, 1 = 안 밀림)
knockback_resist=0.2
; 등장 연출 시간 (이 동안 공격하지 않고 맞지도 않는다)
spawn_time=0.6
