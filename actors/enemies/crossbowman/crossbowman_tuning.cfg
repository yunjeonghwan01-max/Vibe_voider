; 제3부대 석궁병 수치 파일 — 이 파일의 값이 게임에 그대로 적용된다 (코드나 씬에 같은 값이 있어도 이 파일이 이긴다).
; 단위: 시간 = 초, 거리 = px, 속도 = px/s.  기준: 플레이어 평타 1타 = 10 (N)
; [섹션]은 씬 안의 노드 위치("." = 객체 자신), 왼쪽은 속성 이름. 이름은 바꾸지 말고 숫자만 바꾼다.
; 볼트(화살)의 수치도 여기서 정한다 (볼트 씬에는 수치 파일이 없다). 모든 값은 Phase1 프로토타입용 임시값이다.

